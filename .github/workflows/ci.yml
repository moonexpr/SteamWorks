name: build

on:
  push:
    branches:
      - "**"
    paths-ignore:
      - LICENSE
      - README.md
    tags:
      - '*'
  pull_request:
    paths-ignore:
      - LICENSE
      - README.md
  workflow_dispatch:

jobs:
  build:
    name: build on ${{ matrix.os_short }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        include:
          - os: ubuntu-latest
            os_short: linux
          - os: windows-latest
            os_short: win

    steps:
      - name: Prepare env
        shell: bash
        run: |
          echo "GITHUB_SHA_SHORT=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      # Linux needs i386 multilib so the x86 (32-bit) half of the
      # x86,x86_64 matrix can compile and link.
      - name: Install (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y gcc-multilib g++-multilib

      # MSVC toolchain. setup-msbuild puts msbuild on PATH; the vsdevcmd
      # step exports the full x86-on-x64 build environment (cl.exe, libs,
      # include paths) into $GITHUB_ENV so AMBuild can detect both the
      # x86 and x86_64 compilers.
      - name: Add msbuild to PATH (Windows)
        if: runner.os == 'Windows'
        uses: microsoft/setup-msbuild@v2

      - name: Install (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          :: See https://github.com/microsoft/vswhere/wiki/Find-VC
          for /f "usebackq delims=*" %%i in (`vswhere -latest -property installationPath`) do (
            call "%%i"\Common7\Tools\vsdevcmd.bat -arch=x86 -host_arch=x64
          )

          :: Loop over all environment variables and make them global.
          for /f "delims== tokens=1,2" %%a in ('set') do (
            echo>>"%GITHUB_ENV%" %%a=%%b
          )

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Getting SourceMod 1.12
        uses: actions/checkout@v4
        with:
          repository: alliedmodders/sourcemod
          ref: "1.12-dev"
          path: sourcemod-1.12
          submodules: recursive

      - name: Getting MM:Source 1.12
        uses: actions/checkout@v4
        with:
          repository: alliedmodders/metamod-source
          ref: "1.12-dev"
          path: metamod-1.12
          submodules: recursive

      - name: Getting AMBuild
        run: |
          python -m pip install --upgrade pip wheel
          pip install git+https://github.com/alliedmodders/ambuild

      # hl2sdk: only the tf2 branch is needed. tf2 is the 64-bit-capable
      # SDK (it ships lib/public/linux64 + lib/public/x64), so it backs
      # BOTH the x86 and x86_64 targets. AMBuildScript resolves the SDK as
      # <hl2sdk-root>/hl2sdk-tf2, so the clone dir must be exactly
      # "hl2sdk-tf2" and --hl2sdk-root points at the workspace root.
      - name: Getting hl2sdk (tf2)
        shell: bash
        run: |
          git clone --mirror https://github.com/alliedmodders/hl2sdk hl2sdk-proxy-repo
          git clone hl2sdk-proxy-repo -b tf2 hl2sdk-tf2

      # Steamworks SDK. SteamDatabase/SteamworksSDK is 404; the maintained
      # public mirror is rlabrecque/SteamworksSDK (branch main). Layout:
      #   public/steam/*.h
      #   redistributable_bin/steam_api.lib            (win x86)
      #   redistributable_bin/win64/steam_api64.lib    (win x86_64)
      #   redistributable_bin/linux32/libsteam_api.so  (linux x86)
      #   redistributable_bin/linux64/libsteam_api.so  (linux x86_64)
      - name: Getting Steamworks SDK
        run: git clone -b main https://github.com/rlabrecque/SteamworksSDK SteamworksSDK

      # Verify the Windows x64 import library exists before we depend on it
      # at link time. Fails loudly if the mirror layout ever drifts.
      - name: Verify Steamworks win64 import lib
        shell: bash
        run: |
          LIB="SteamworksSDK/redistributable_bin/win64/steam_api64.lib"
          if [ ! -f "$LIB" ]; then
            echo "::error::Expected Steamworks win64 import lib not found: $LIB"
            ls -la SteamworksSDK/redistributable_bin/win64 || true
            exit 1
          fi
          echo "Found Windows x64 Steamworks import lib: $LIB"

      - name: Getting own repository
        uses: actions/checkout@v4
        with:
          path: SteamWorks
          submodules: recursive

      - name: Compiling SteamWorks files
        working-directory: SteamWorks
        shell: bash
        run: |
          mkdir build && cd build
          python ../configure.py \
            -s tf2 \
            --targets x86,x86_64 \
            --enable-optimize \
            --hl2sdk-root "${GITHUB_WORKSPACE}" \
            --sm-path "${GITHUB_WORKSPACE}/sourcemod-1.12" \
            --mms-path "${GITHUB_WORKSPACE}/metamod-1.12" \
            --steamworks-path "${GITHUB_WORKSPACE}/SteamworksSDK"
          ambuild

      - name: Uploading package
        uses: actions/upload-artifact@v4
        with:
          name: SteamWorks-${{ matrix.os_short }}
          path: SteamWorks/build/package
